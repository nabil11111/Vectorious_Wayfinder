# docker compose up starts the whole stack: Postgres, then the app, which applies migrations and loads the
# seed data before it starts serving on http://localhost:3000.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wayfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wayfinder}
      POSTGRES_DB: ${POSTGRES_DB:-wayfinder}
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-wayfinder}:${POSTGRES_PASSWORD:-wayfinder}@db:5432/${POSTGRES_DB:-wayfinder}
      SEED_PASSWORD: ${SEED_PASSWORD:-wayfinder-demo}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-wayfinder-admin}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      DEMO_MODE: ${DEMO_MODE:-true}
      LIVE_HEARTBEAT_MS: ${LIVE_HEARTBEAT_MS:-20000}
      LIVE_MAX_STREAMS: ${LIVE_MAX_STREAMS:-200}
    ports:
      - "3000:3000"

volumes:
  db-data:
